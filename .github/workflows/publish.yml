name: publish

# mooncakes.io 发版：push tag v* 或 workflow_dispatch（手动 `gh workflow run publish.yml`）触发；
# 按依赖拓扑序 publish 4 模块（demo 不发布）。版本号严禁跳号（1.0.0 起完整递增）。
# 失败重试（关键，09-09 v0.1.5 教训）：**修复落在 master、而 tag 仍指旧 commit 时**，Actions
# Re-run / 删 tag 重打都只 checkout tag 记录的那个旧 commit，**拿不到该修复**（v0.1.5 即因此
# Re-run 会重撞旧守卫发不出去）——须改用 workflow_dispatch（checkout master HEAD）或把 tag
# 重指到修复后的 commit 再推；**纯偶发**（网络/CDN 抖动）才直接 Actions Re-run 原 run；部分
# 模块已发成功则按拓扑步进补发失败模块、勿 bump 版本号绕（详见 docs/PUBLISH.md）。
#
# 工具链策略（2026-09-05 分析见 docs/PUBLISH.md；2026-09-09 复测 + owner 定调改策略）：
# - 只能装 latest，钉版本不可行（09-09 复测）：cli.moonbitlang.com 显式版本路径为 S3
#   AccessDenied 403（服务端持久策略）；www 域同路径实为 Docusaurus 404 页，非产物；
# - latest 是**向前别名**，正常只前进（出 bug 也是修完升版本号，不回退旧构建）；
#   原 EXPECTED_MOON_VERSION 版本守卫（9/4 坏构建事故后设）会在每次编译器正常更新时
#   永久拦死发版——**09-09 owner 定调：去掉守卫，直接装 latest 发版**，仅在日志记录
#   本次发版实际编译器版本留痕。注：编译器小版本**仍可能引入破坏**（实测 0.1.20260904
#   把旧式泛型写法 fn name[T] 判为 parse error [3002]，仓内 3 处漏网已改标准 fn[T] name，
#   见 0d23278）——发版遇 check 失败按错误信息修语法、commit 进 master，再走
#   workflow_dispatch 重发（直接 Re-run 会 checkout tag 旧 commit，修复不生效），不必等/回退编译器。
# - 留痕：9/4 晚 latest 曾是含 "TOML moon.mod import @版本解析" bug 的坏构建，
#   官方撤回后 09-05 回到 0.1.20260827（d0aaa07）；09-09 latest 前移到 0.1.20260904。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      validate_only:
        description: "仅自检通道（装工具链+依赖+构建），不执行 publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          "$HOME/.moon/bin/moon" version   # 留痕：本次发版实际编译器版本进 run log

      - name: Write mooncakes credentials
        run: |
          mkdir -p ~/.moon
          cat > ~/.moon/credentials.json <<EOF
          {"token":"${{ secrets.MOON_TOKEN }}","username":"${{ secrets.MOON_USERNAME }}"}
          EOF

      - name: Update registry index + install workspace dependencies
        run: |
          moon update
          moon install

      - name: Validate channel only (build gate, no publish)
        if: ${{ inputs.validate_only }}
        run: |
          echo "通道自检：工具链 + workspace 依赖 + native 构建全通过即视为发版通道可用"
          moon build --target native

      # 拓扑序：core → persist → repository-mysql → facade（demo 不发布）
      - name: Publish core
        if: ${{ !inputs.validate_only }}
        run: cd core && moon publish

      - name: Publish persist
        if: ${{ !inputs.validate_only }}
        run: cd persist && moon publish

      - name: Publish repository-mysql
        if: ${{ !inputs.validate_only }}
        run: cd repository-mysql && moon publish

      - name: Publish facade
        if: ${{ !inputs.validate_only }}
        run: cd facade && moon publish

name: Native Probe

# 试验：demo 在 linux native 下能否构建/运行（wasm 之外的第二形态，
# 为 Docker 容器化部署铺路；本机 Windows 因 MSVC 墙不可构建，见 D-M0-2/R8）。
on:
  workflow_dispatch:

jobs:
  native-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: |
          moon version --all
          moon update

      - name: Native build (workspace)
        # --no-render：诊断走裸文本而非 ariadne 渲染。本仓现存 11 条告警（MAINTAINING §1.3
        # 已逐条证伪"可摘"），而 0.1.20260920 的渲染器在有告警时会 panic
        # （ariadne: Label start is after its end）——2026-09-26 那次 Native Probe 就是这么红的，
        # 与代码正确性无关。等上游修好渲染器可去掉这个开关。
        run: moon build --target native --no-render

      - name: Run demo health flow (native)
        run: |
          # 后台起 demo（native 二进制），健康检查通过即形态成立
          (moon run --target native demo/cmd/main > /tmp/demo.log 2>&1 &)
          sleep 8
          curl -sf http://127.0.0.1:8092/health && echo "NATIVE DEMO OK"

      - name: Native test (full suite)
        run: moon test --target native --no-render
